[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
pressa-core = { path = "crates/core" }
anyhow = "1"
rayon = "1.12"

# Image codecs are slow in debug builds; optimize dependencies even in dev.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
